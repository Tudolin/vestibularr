<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão · Vestibularr</title>
<meta name="theme-color" content="#4f46e5">
<style>
  :root { --bg:#f7f7fb; --fg:#14142b; --muted:#55557a; --card:#fff; --primary:#4f46e5; --on-primary:#fff; --border:#dcdcec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d1a; --fg:#ececf8; --muted:#a9a9c8; --card:#161628; --primary:#8b93ff; --on-primary:#0d0d1a; --border:#2b2b46; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:16px; }
  main { max-width:26rem; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center; }
  h1 { font-size:1.4rem; margin:.5rem 0; }
  p { color:var(--muted); }
  button { min-height:48px; padding:0 24px; border:0; border-radius:12px; background:var(--primary); color:var(--on-primary); font:inherit; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<main>
  <div aria-hidden="true" style="font-size:2.5rem">📶</div>
  <h1>Você está sem conexão</h1>
  <p>Simulados e redações que você abriu recentemente continuam funcionando offline. Suas respostas ficam guardadas no aparelho e são enviadas quando a internet voltar.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
